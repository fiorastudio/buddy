# Buddy World — Cloudflare Worker config
# Deploy: wrangler d1 create buddy-world (once), then
#         wrangler d1 migrations apply buddy-world --remote
#         wrangler deploy

name = "buddy-world"
main = "../src/world/worker.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "buddy-world"
# Account-specific — set locally per deployer, don't commit a real id (avoids
# cross-wiring forks/staging/prod). Run `wrangler d1 create buddy-world` and
# paste the id here (or use a per-environment [env.*] block / CI secret).
database_id = "REPLACE_WITH_YOUR_D1_ID"
migrations_dir = "migrations"

# Serve the plaza frontend (index.html, plaza.js, sprites/jobs, music) from the
# same Worker so one URL does both static + the /v1 API (same-origin fetches).
[assets]
directory = "./public"

# One live "room" Durable Object per town (WebSocket Hibernation). The class is
# exported from src/world/worker.ts.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "WorldRoom"

# Legacy migration path (chosen over the newer declarative [exports] lifecycle
# for simplicity; the two are mutually exclusive). SQLite-backed DO storage.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorldRoom"]

[vars]
BASE_URL = "https://world.buddy-mcp.com"

# Nightly analytics rollup (spec: daily_rollups)
[triggers]
crons = ["17 0 * * *"]
