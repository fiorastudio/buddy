<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buddy World</title>
<style>
  :root { --gold: #ffd700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1430; font-family: 'Menlo', 'Consolas', monospace; overflow: hidden; }
  #ticker {
    position: fixed; top: 0; left: 0; right: 0; height: 28px; z-index: 10;
    background: rgba(15, 12, 41, 0.92); color: #b39ddb; font-size: 12px;
    display: flex; align-items: center; padding: 0 12px; gap: 24px;
    border-bottom: 1px solid #3a2f6b; white-space: nowrap; overflow: hidden;
  }
  #ticker .line { opacity: 0.9; }
  #ticker .brand { color: var(--gold); font-weight: bold; flex-shrink: 0; }
  /* RO world-broadcast: the iconic yellow announcement that sweeps across the
     top for BIG moments (level-ups, ships). Distinct from the quiet #ticker —
     gold gradient, glowing #ffff00 text, a right-to-left marquee. */
  #broadcast {
    position: fixed; top: 28px; left: 0; right: 0; height: 34px; z-index: 12;
    display: flex; align-items: center; overflow: hidden; white-space: nowrap;
    background: linear-gradient(180deg, #4a3a00 0%, #2a2100 100%);
    border-bottom: 2px solid #ffd700;
    box-shadow: 0 2px 14px rgba(255, 215, 0, 0.4);
    color: #ffff00; font-weight: bold; font-size: 15px; letter-spacing: 0.3px;
    text-shadow: 0 0 7px rgba(255, 221, 0, 0.85), 0 1px 2px #000;
  }
  #broadcast[hidden] { display: none; }
  #broadcast .broadcast-msg { display: inline-block; padding-left: 100%; }
  /* Arrival: scroll the message right-to-left across the screen (RO homage). */
  #broadcast.scroll .broadcast-msg { animation: broadcast-scroll 9s linear; }
  @keyframes broadcast-scroll {
    from { transform: translateX(0%); }
    to { transform: translateX(-100%); }
  }
  /* Static tier (reduced-motion / .static): centered, no scroll, just holds. */
  #broadcast.static { justify-content: center; }
  #broadcast.static .broadcast-msg { padding-left: 0; animation: none; }
  @media (prefers-reduced-motion: reduce) {
    #broadcast { justify-content: center; }
    #broadcast .broadcast-msg { padding-left: 0; animation: none !important; }
  }
  #plaza { display: block; }
  #cta {
    position: fixed; bottom: 12px; right: 14px; z-index: 10;
    background: rgba(15, 12, 41, 0.92); border: 1px solid #3a2f6b; border-radius: 8px;
    padding: 8px 14px; font-size: 12px; color: #e1bee7;
  }
  #cta a { color: var(--gold); text-decoration: none; }
  /* Warp is no longer a button — travel by walking your sprite into an
     in-world portal gate (drawn on the canvas; see plaza.js drawPortals). */
  #sfx-toggle {
    position: fixed; bottom: 12px; left: 112px; z-index: 11;
    background: rgba(15, 12, 41, 0.92); border: 1px solid #3a2f6b; border-radius: 8px;
    padding: 8px 12px; font-size: 13px; color: #e1bee7; cursor: pointer;
    font-family: inherit;
  }
  #sfx-toggle:hover, #sfx-toggle:focus-visible { border-color: var(--gold); color: var(--gold); }
  #music-toggle {
    position: fixed; bottom: 12px; left: 14px; z-index: 11;
    background: rgba(15, 12, 41, 0.92); border: 1px solid #3a2f6b; border-radius: 8px;
    padding: 8px 12px; font-size: 13px; color: #e1bee7; cursor: pointer;
    font-family: inherit;
  }
  #music-toggle:hover, #music-toggle:focus-visible { border-color: var(--gold); color: var(--gold); }
  /* music is a hidden <audio> element — no visible player, no iframe */
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }
</style>
</head>
<body>
  <div id="ticker" aria-live="polite"><span class="brand">⛲ BUDDY WORLD</span></div>
  <div id="broadcast" role="status" aria-live="polite" hidden></div>
  <canvas id="plaza" role="img" aria-label="Buddy World plaza"></canvas>
  <ul id="sr-citizens" class="visually-hidden" aria-label="Buddies currently in the plaza"></ul>
  <div id="cta">no buddy yet? <a href="https://github.com/fiorastudio/buddy" target="_blank" rel="noopener">adopt your own →</a></div>
  <button id="music-toggle" aria-label="Play plaza music" aria-pressed="false">🎵 music</button>
  <button id="sfx-toggle" aria-label="Enable sound effects (level-up chimes, deploy fireworks)" aria-pressed="false">🔔 sfx</button>
  <audio id="music-audio" loop preload="none">
    <source src="music/plaza-theme.ogg" type="audio/ogg">
    <source src="music/plaza-theme.mp3" type="audio/mpeg">
  </audio>
  <script src="plaza.js"></script>
</body>
</html>
